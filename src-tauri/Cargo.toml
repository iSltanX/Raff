[package]
name = "raff"
version = "6.0.0"
description = "رفّ — personal, keyboard-first clipboard manager for macOS; your clipboard stays on your Mac"
authors = ["Raff"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "tiff", "jpeg"] }
# The in-app report's one POST. Pinned to the version tauri-plugin-updater
# already brings, with the features already in the tree — rustls on ring, no
# aws-lc-rs, no native-tls — so Cargo.lock gains no package.
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
core-graphics = "0.25"
core-foundation = "0.10"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSAppearance",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSWorkspace",
    "NSRunningApplication",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true

<!doctype html>
<!--
  The DMG window background — رفّ's installer, 660 × 400 pt (Figma
  XCNmucSuAe007qWHnOXQpW «05 — DMG & README», DMG/Background 71:97).
  Design source only: `npm run dmg:background` renders it (1× and 2×) and
  packs background.tiff, which scripts/dmg-layout.mjs puts in the DMG.
  Colours, fonts and the mark come from the app itself (src/).

  The idea: رفّ's mark is the shelf, without its card. Finder draws the real
  Raff.app where the card would be: at icon size 144 its plate is 115.875 pt,
  the mark's 233-unit square at this scale, so it fills that square and rests
  on the shelf (dmg-layout.mjs: ICON_SIZE, ICON_CENTRES). Applications sits to
  its left on the same line, and the drag runs right to left.

  Light only: Finder takes one background picture, never one per appearance,
  and draws such a window light with dark labels even in Dark Mode (seen in
  Finder on macOS 27, 2026-10-22). So the shelf is a sand tone a dark label
  reads on, and so is the window behind Applications.
-->
<html lang="ar" dir="rtl" data-appearance="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../src/tokens.css">
<style>
  html, body { margin: 0; width: 660px; height: 400px; overflow: hidden; }
  body {
    position: relative;
    background: var(--line-strong);
    color: var(--ink);
    font-family: var(--font-ar);
    -webkit-font-smoothing: antialiased;
  }
  .abs { position: absolute; }

  /* The mark as the shelf: its own outline, scaled 115.875 / 233. */
  .shelf { left: 300.0625px; top: 132.0625px; width: 303.3637px; height: 187.4887px;
    background: var(--ink-disabled);
    -webkit-mask: url('../../src/assets/brand/mark-base.svg') 0 0 / 100% 100% no-repeat;
    mask: url('../../src/assets/brand/mark-base.svg') 0 0 / 100% 100% no-repeat;
  }
  /* Where the plate meets the shelf. Flat: a tone, no blur. */
  .contact { left: 314px; top: 247.9375px; width: 88px; height: 4px; border-radius: 2px; background: var(--line-input); }

  /* The drag, right to left: six dots and a chevron, clear of both icons —
     Finder's folder art ends at x 216 and Raff's plate starts at 300
     (measured in Finder on macOS 27, 2026-10-22). */
  .dot { top: 188px; width: 4px; height: 4px; border-radius: 50%; background: var(--brand-accent); }
  .chevron { left: 224px; top: 182px; width: 10px; height: 16px; }

  .line { left: 40px; width: 580px; text-align: center; }
  .instruction { top: 40px; font: 700 22px/34px var(--font-heading); color: var(--ink); }
  .instruction-en { top: 78px; direction: ltr; font: 500 12px/16px var(--font-latin); color: var(--ink-2); }
  .gatekeeper { top: 356px; font: 400 11.5px/18px var(--font-ar); color: var(--ink-2); }
  bdi { font-family: var(--font-latin); }
</style>
</head>
<body>
  <div class="abs line instruction">اسحب رفّ إلى التطبيقات</div>
  <div class="abs line instruction-en">Drag Raff to Applications</div>

  <div class="abs shelf"></div>
  <div class="abs contact"></div>

  <div class="abs dot" style="left: 285px"></div>
  <div class="abs dot" style="left: 276px"></div>
  <div class="abs dot" style="left: 267px"></div>
  <div class="abs dot" style="left: 258px"></div>
  <div class="abs dot" style="left: 249px"></div>
  <div class="abs dot" style="left: 240px"></div>
  <svg class="abs chevron" viewBox="0 0 10 16" aria-hidden="true">
    <path d="M8.5 1.5L2 8L8.5 14.5" fill="none" style="stroke: var(--brand-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="abs line gatekeeper">إن نبّهك <bdi>macOS</bdi> أول مرة: الإعدادات ← الخصوصية والأمن ← «افتح على أي حال»</div>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>عن رفّ</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="controls.css" />
  <link rel="stylesheet" href="about.css" />
</head>
<body>
  <!-- Figma «07» About window 270:596: identity, the update action, then links. -->
  <main class="about" id="about">
    <div class="window-controls" data-tauri-drag-region>
      <button type="button" class="dot dot-close" id="about-close" title="إغلاق" aria-label="إغلاق نافذة عن رفّ" tabindex="-1"></button>
      <span class="dot dot-min" aria-hidden="true"></span>
      <span class="dot dot-zoom" aria-hidden="true"></span>
    </div>
    <div class="identity-row">
      <img class="logo-graphic" src="assets/app-icon.png" width="88" height="88" alt="" aria-hidden="true" />
      <h1 class="app-name">رفّ</h1>
      <p class="tagline">كل ما نسخته، على رفٍّ قريب.</p>
      <p class="app-version" id="app-version" dir="rtl"></p>
    </div>

    <div class="actions-bottom">
      <div class="update-group">
        <button type="button" class="btn" id="update-btn">التحقق من التحديثات</button>
        <p class="update-status" id="update-status" role="status"></p>
      </div>
    </div>

    <div class="links">
      <button type="button" class="link-btn latin" id="repo-link" dir="ltr">github.com/iSltanX/Raff</button>
      <span class="link-sep" aria-hidden="true">·</span>
      <button type="button" class="link-btn" id="privacy-link">سياسة الخصوصية</button>
    </div>
    <p class="credit">تصميم وتطوير: سلطان · © ٢٠٢٦</p>
  </main>
  <script type="module" src="js/about.js"></script>
</body>
</html>

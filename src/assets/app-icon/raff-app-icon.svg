<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    رفّ — Raff app icon.
    Figma «11 — Brand Applications» → "Raff App Icon" (node 3:7186), authored at
    240 × 240 and scaled here by 1024/240 = 4.266667:

      corner radius   54  → 230.4
      shelf bar       108 × 14, radius 7 → 460.8 × 59.733, radius 29.867
      gap between     19  → 81.067
      fill            linear-gradient top→bottom  #C4704B → #A35634
      bars            #FFFFFF

    The mark is the shelf itself — three bars, the same figure the brand mark
    on the cover draws. Nothing here is approximated: every number is the
    Figma value times the scale factor.
  -->
  <defs>
    <linearGradient id="raff-surface" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C4704B"/>
      <stop offset="1" stop-color="#A35634"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230.4" ry="230.4" fill="url(#raff-surface)"/>
  <g fill="#FFFFFF">
    <rect x="281.6" y="341.333" width="460.8" height="59.733" rx="29.867" ry="29.867"/>
    <rect x="281.6" y="482.133" width="460.8" height="59.733" rx="29.867" ry="29.867"/>
    <rect x="281.6" y="622.933" width="460.8" height="59.733" rx="29.867" ry="29.867"/>
  </g>
</svg>

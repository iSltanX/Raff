<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>رفّ</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <!-- Figma «08 — Product Screens» → macOS-Panel-Shell (2:7684), 360 × 580. -->
  <main class="panel" id="panel">
    <header class="panel-header">
      <!-- Window Controls/Utility (2:7686). Physically left, as on every macOS
           window — the traffic lights never mirror in RTL. -->
      <div class="window-controls">
        <button type="button" class="dot dot-close" id="panel-close" title="إغلاق" aria-label="إغلاق رفّ" tabindex="-1"></button>
        <span class="dot dot-min" aria-hidden="true"></span>
        <span class="dot dot-zoom" aria-hidden="true"></span>
      </div>

      <div class="brand">
        <strong class="brand-name">رفّ</strong>
        <span class="brand-mark" id="brand-mark" aria-hidden="true"></span>
      </div>

      <div class="header-actions">
        <button
          type="button"
          class="action-btn"
          id="settings-btn"
          title="الإعدادات"
          aria-label="فتح إعدادات رفّ"
          tabindex="-1"
        ></button>
      </div>
    </header>

    <div class="search-container">
      <div class="search-field" id="search-field">
        <span class="search-glyph" id="search-glyph" aria-hidden="true"></span>
        <input
          id="search"
          class="search-input"
          type="text"
          placeholder="ابحث في رفّك…"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          aria-label="ابحث في رفّك"
        />
        <button
          type="button"
          class="search-clear"
          id="search-clear"
          title="مسح البحث"
          aria-label="مسح البحث"
          tabindex="-1"
          hidden
        ></button>
      </div>
    </div>

    <!-- Filters (2:7710). RTL reading order: الكل is the rightmost segment. -->
    <div class="filters" id="filters" role="tablist" aria-label="تصفية العناصر">
      <button type="button" class="segment is-active" data-filter="all" role="tab" aria-selected="true" tabindex="-1">الكل</button>
      <button type="button" class="segment" data-filter="text" role="tab" aria-selected="false" tabindex="-1">نص</button>
      <button type="button" class="segment" data-filter="link" role="tab" aria-selected="false" tabindex="-1">روابط</button>
      <button type="button" class="segment" data-filter="image" role="tab" aria-selected="false" tabindex="-1">صور</button>
      <button type="button" class="segment" data-filter="pinned" role="tab" aria-selected="false" tabindex="-1">مثبّت</button>
    </div>

    <div class="items-list" id="list" role="listbox" aria-label="عناصر الحافظة"></div>

    <footer class="panel-footer">
      <span class="footer-hint" id="footer-hint"><kbd>⌘V</kbd> للصق الفوري</span>
      <span class="toast" id="toast" hidden></span>
    </footer>
  </main>
  <script type="module" src="js/panel.js"></script>
</body>
</html>

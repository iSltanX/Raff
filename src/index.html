<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>رفّ</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="controls.css" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <main class="panel" id="panel">
    <header class="panel-header" id="panel-header">
      <div class="search-field" id="search-field">
        <span class="search-glyph" id="search-glyph" aria-hidden="true"></span>
        <input
          id="search"
          class="search-input"
          type="text"
          placeholder="ابحث في رفّك…"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          aria-label="ابحث في رفّك"
          role="combobox"
          aria-autocomplete="list"
          aria-haspopup="grid"
          aria-controls="list"
          aria-expanded="false"
        />
        <button
          type="button"
          class="search-clear"
          id="search-clear"
          title="مسح البحث"
          aria-label="مسح البحث"
          tabindex="-1"
          hidden
        ></button>
      </div>
      <button
        type="button"
        class="icon-btn"
        id="settings-btn"
        title="الإعدادات"
        aria-label="فتح إعدادات رفّ"
        aria-keyshortcuts="Meta+,"
      ></button>
      <button
        type="button"
        class="icon-btn"
        id="panel-close"
        title="إغلاق"
        aria-label="إغلاق رفّ"
        tabindex="-1"
      ></button>
    </header>

    <div class="filters" id="filters" role="tablist" aria-label="تصفية العناصر">
      <button type="button" class="segment is-active" data-filter="all" role="tab" aria-selected="true" aria-controls="list" tabindex="0">الكل</button>
      <button type="button" class="segment" data-filter="text" role="tab" aria-selected="false" aria-controls="list" tabindex="-1">نص</button>
      <button type="button" class="segment" data-filter="link" role="tab" aria-selected="false" aria-controls="list" tabindex="-1">روابط</button>
      <button type="button" class="segment" data-filter="image" role="tab" aria-selected="false" aria-controls="list" tabindex="-1">صور</button>
      <button type="button" class="segment" data-filter="pinned" role="tab" aria-selected="false" aria-controls="list" tabindex="-1">مثبّت</button>
    </div>

    <!-- Figma Panel Status Strip 283:402: shown only while رفّ is not saving. -->
    <div class="capture-strip" id="capture-strip" role="status" hidden>
      <span class="capture-strip-icon" id="capture-strip-icon" aria-hidden="true"></span>
      <span class="capture-strip-text" id="capture-strip-text"></span>
      <button type="button" class="capture-strip-action" id="capture-strip-action"></button>
    </div>

    <div class="items-list" id="list" role="region" aria-label="حالة عناصر الحافظة" aria-busy="true"></div>

    <span class="sr-only" id="feedback-announcer" role="status" aria-live="polite" aria-atomic="true"></span>
    <span class="sr-only" id="preview-announcer" role="status" aria-live="polite" aria-atomic="true"></span>

    <div class="panel-feedback" id="panel-feedback" hidden>
      <div class="toast" id="toast" role="group" aria-label="رسالة حالة" hidden>
        <span class="toast-icon" id="toast-icon" aria-hidden="true"></span>
        <span class="toast-message" id="toast-message"></span>
        <button type="button" class="toast-btn" id="toast-undo" aria-label="تراجع" aria-keyshortcuts="Meta+Z" title="تراجع (⌘Z)" hidden>تراجع</button>
        <button type="button" class="toast-btn" id="toast-action" hidden></button>
      </div>
    </div>

    <footer class="panel-footer">
      <span class="footer-mark" aria-hidden="true"><span class="mark-base"></span><span class="mark-card"></span></span>
      <nav class="footer-shortcuts" id="footer-hint" aria-label="اختصارات السياق الحالي"></nav>
    </footer>
  </main>

  <!-- The preview beside the panel (Figma «05 · التفاصيل» 45:5325): the panel
       window widens towards it, so it lives in this page. Opened by resting
       on an item, a right-click, Space or ⌘Y; its buttons never take focus. -->
  <aside class="preview-pane" id="preview" aria-label="معاينة العنصر" hidden>
    <div class="preview-head">
      <span class="badge preview-kind" id="preview-kind"></span>
      <span class="preview-when" id="preview-when"></span>
      <span class="badge preview-size" id="preview-size"></span>
    </div>
    <div class="preview-body scroll-pane" id="preview-body"></div>
    <div class="preview-notes" id="preview-notes"></div>
    <div class="preview-actions">
      <button type="button" class="btn btn-primary" data-action="paste" tabindex="-1" aria-keyshortcuts="Enter"><span>لصق</span><bdi class="btn-keys">↵</bdi></button>
      <div class="preview-pair">
        <button type="button" class="btn" data-action="plain" tabindex="-1" aria-keyshortcuts="Alt+Enter"><span>لصق كنص عادي</span><bdi class="btn-keys">⌥↵</bdi></button>
        <button type="button" class="btn" data-action="copy" tabindex="-1" aria-keyshortcuts="Meta+C"><span class="preview-icon" data-icon="copy"></span><span>نسخ</span><bdi class="btn-keys">⌘C</bdi></button>
      </div>
      <!-- IMP-06: shown only for text with harakat or tatweel to drop. -->
      <button type="button" class="btn btn-quiet" data-action="bare" tabindex="-1" aria-keyshortcuts="Control+Enter" hidden><span>لصق بلا تشكيل</span><bdi class="btn-keys">⌃↵</bdi></button>
      <!-- IMP-07: a pinned item's name. The field opens in place; Enter saves,
           Escape cancels and gives the keyboard back to search. -->
      <button type="button" class="btn btn-quiet" data-action="label" tabindex="-1" hidden><span id="preview-label-text">تسمية</span></button>
      <form class="preview-label-form" id="preview-label-form" hidden>
        <input type="text" class="text-input" id="preview-label-input" maxlength="40" dir="auto" autocomplete="off" spellcheck="false" aria-label="اسم المثبّت" placeholder="اسم للمثبّت" />
        <button type="submit" class="btn">حفظ</button>
      </form>
      <div class="preview-pair">
        <button type="button" class="btn" data-action="pin" tabindex="-1" aria-keyshortcuts="Alt+P"><span class="preview-icon" data-icon="pin"></span><span id="preview-pin-label">تثبيت</span><bdi class="btn-keys">⌥P</bdi></button>
        <button type="button" class="btn btn-quiet" data-action="delete" tabindex="-1" aria-keyshortcuts="Meta+Backspace"><span class="preview-icon" data-icon="trash"></span><span>حذف</span><bdi class="btn-keys">⌘⌫</bdi></button>
      </div>
    </div>
  </aside>
  <script type="module" src="js/panel.js"></script>
</body>
</html>

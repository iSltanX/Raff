<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>تحديث رفّ</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="controls.css" />
  <link rel="stylesheet" href="update.css" />
</head>
<body>
  <!-- The overlay title bar's strip, where macOS would let the window be dragged. -->
  <div class="title-drag" data-tauri-drag-region aria-hidden="true"></div>
  <!-- Figma «08 · نوافذ أخرى» 45:6180, Update 360×280: the icon and a
       two-line head, the progress bar, then the actions at the row's end. -->
  <main class="update-window" id="update-window" aria-busy="true">
    <!-- Read, not drawn: the window's name for a screen reader's headings (021 ج4). -->
    <h1 class="sr-only">تحديث رفّ</h1>
    <div class="update-head">
      <img class="update-icon" src="assets/app-icon.png" alt="أيقونة رفّ" width="48" height="48" />
      <div class="update-text">
        <div
          class="update-status"
          id="u-status"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        >جارٍ التحقق من وجود تحديثات…</div>
        <div class="update-sub" id="u-sub">يتصل رفّ بإصدارات المستودع فقط.</div>
      </div>
    </div>

    <div class="update-available" id="u-available" hidden>
      <div class="update-new-version" id="u-new-version"></div>
      <div class="update-date" id="u-date" hidden></div>
      <div class="update-notes scroll-pane" id="u-notes" dir="auto" hidden></div>
    </div>

    <div class="update-progress" id="u-progress" hidden>
      <div
        class="update-bar"
        id="u-bar"
        role="progressbar"
        aria-label="تقدّم تنزيل التحديث"
        aria-valuemin="0"
        aria-valuemax="100"
      ><div class="update-bar-fill" id="u-bar-fill"></div></div>
    </div>

    <div class="update-actions">
      <!-- RTL: the primary action ends the row (leftmost), as everywhere. -->
      <button type="button" class="btn btn-quiet" id="u-ok" hidden>حسنًا</button>
      <button type="button" class="btn btn-quiet" id="u-later" hidden>لاحقًا</button>
      <button type="button" class="btn" id="u-retry" hidden>إعادة المحاولة</button>
      <button type="button" class="btn btn-primary" id="u-download" hidden>تنزيل وتثبيت</button>
      <button type="button" class="btn btn-primary" id="u-restart" hidden>إعادة التشغيل</button>
    </div>
  </main>
  <script type="module" src="js/update.js"></script>
</body>
</html>
